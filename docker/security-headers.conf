# Security headers, included wherever nginx adds headers of its own. (In nginx, an `add_header` inside
# a location replaces every header set outside it, so each such location includes this file again.)

# Where the page may load things from:
#  - scripts, styles, fonts and images are the app's own files (the font is self-hosted);
#  - the map style, tiles, glyphs and sprites come from OpenFreeMap, over HTTPS only;
#  - MapLibre draws on workers (a file of ours, or a blob it makes) and in blob and data images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Location is the one sensor the page uses, and only for itself; everything else is off.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Only means something over HTTPS, which a proxy or load balancer in front of this container provides.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
