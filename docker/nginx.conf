server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not tell visitors which nginx version this is.
    server_tokens off;

    # nginx does not know the .mjs extension, and would serve it as application/octet-stream. Browsers
    # refuse a module worker with that type, so the map's worker would fail to load and the map would
    # have no vector tiles. (Adding a type here, after including the usual list, keeps all the others.)
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Files the build names after their contents (assets/index-3f9a1c.js) never change, so they can be
    # cached for a year; a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The page and the data keep their names between builds, so the browser checks them every time
    # (a cheap 304 when nothing changed) instead of showing an old version.
    location = / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /branches.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # For the container's health check, answered by nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Icons and anything else. There is one page and no client-side routes, so an unknown address is a 404.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
