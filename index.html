<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find a Capitec branch or ATM near you, on a map or in a list, with opening hours and directions."
    />
    <meta name="theme-color" content="#2f6fed" />
    <title>Find a Branch, ATM or Smart ID Service Near You | Capitec</title>
    <!-- The font is used by the first paint; fetching it now, not after the CSS is parsed, stops the text jumping when it arrives. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/nunito-sans/files/nunito-sans-latin-wght-normal.woff2"
    />
    <!-- The map style, tiles and glyphs all come from here; opening the connection early saves a round trip. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
