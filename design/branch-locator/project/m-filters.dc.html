<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile filter sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locator.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}.fr{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--app-border);cursor:pointer}.fr input{width:24px;height:24px;accent-color:var(--app-primary-deep);flex:none;margin:0}.fr span{flex:1;font-weight:500;color:var(--app-ink)}.fr svg{color:var(--app-text-muted)}.fr input:focus-visible{outline:2px solid var(--app-ink);outline-offset:2px}fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--app-text-muted);margin-bottom:4px}</style>
</helmet>
<div class="lc" style="width:375px;height:812px">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-deposit" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"/></symbol>
<symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></symbol>
<symbol id="i-24h" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14 5M4 12a8 8 0 0114-5M18 3v4h-4M6 21v-4h4"/></symbol>
<symbol id="i-wheel" viewBox="0 0 24 24"><circle cx="10" cy="4.5" r="1.5"/><path d="M10 8v6h5l3 5M7 12a5 5 0 105 7"/></symbol>
</defs></svg>

<div class="map" aria-hidden="true"><div class="water" style="left:-40px;top:300px;width:150px;height:120px"></div>
</div>
<div style="position:absolute;inset:0;background:var(--lc-scrim)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ft" class="sheet" style="top:72px;z-index:20">
  <div class="grab"><i></i></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px 16px">
    <h1 id="ft" class="h4" style="margin:0">Filters</h1>
    <button type="button" class="ib" style="border:0" aria-label="Close filters"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="divider"></div>
  <div style="flex:1;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:16px">
    <fieldset><legend>Opening times</legend>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span>Open now</span><input type="checkbox" checked></label>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span>Open Saturday</span><input type="checkbox"></label>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span>Open Sunday / public holidays</span><input type="checkbox"></label>
    </fieldset>
    <fieldset><legend>Services</legend>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-deposit"/></svg><span>ATM with cash deposits</span><input type="checkbox" checked></label>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-24h"/></svg><span>24-hour access</span><input type="checkbox"></label>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-wheel"/></svg><span>Wheelchair accessible</span><input type="checkbox"></label>
      <label class="fr"><svg class="i" aria-hidden="true"><use href="#i-brief"/></svg><span>Business banking</span><input type="checkbox"></label>
    </fieldset>
    <fieldset><legend>Sort by</legend>
      <div class="seg" role="radiogroup" aria-label="Sort by">
        <button type="button" role="radio" aria-checked="true" aria-pressed="true">Distance</button>
        <button type="button" role="radio" aria-checked="false" aria-pressed="false">Name A–Z</button>
      </div>
    </fieldset>
  </div>
  <div style="padding:12px 16px 16px;border-top:1px solid var(--app-border);display:flex;gap:8px;align-items:center;background:#fff">
    <button type="button" class="btn btn-t">Clear all</button>
    <button type="button" class="btn" style="flex:1">Show 3 results</button>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
