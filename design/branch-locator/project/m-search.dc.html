<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile search with autosuggest</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locator.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lc" style="width:375px;height:812px">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-bank" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</defs></svg>

<div class="map" aria-hidden="true"><div class="water" style="left:-40px;top:300px;width:150px;height:120px"></div></div>
<div style="position:absolute;inset:0;background:rgba(255,255,255,.88)"></div>

<header style="position:absolute;left:0;right:0;top:0;padding:16px 8px 0 16px;display:flex;gap:4px;align-items:center;z-index:10">
  <form role="search" class="inp focus" style="flex:1;padding-right:4px;outline:2px solid var(--app-ink);outline-offset:2px">
    <svg class="i s" aria-hidden="true"><use href="#i-search"/></svg>
    <label for="q" style="position:absolute;left:-999px">Search for a place, suburb, town or postcode</label>
    <input id="q" type="search" role="combobox" aria-expanded="true" aria-controls="sug" value="Clar">
    <button type="button" class="ib" style="border:0" aria-label="Clear search"><svg class="i s"><use href="#i-x"/></svg></button>
  </form>
  <button type="button" class="btn btn-t">Cancel</button>
</header>

<main style="position:absolute;left:0;right:0;top:88px;bottom:0;padding:16px 0;z-index:10;overflow:hidden">
  <button type="button" class="row" style="min-height:64px">
    <span style="width:40px;height:40px;border-radius:50%;background:var(--app-primary-tint);color:var(--app-primary-deep);display:flex;align-items:center;justify-content:center;flex:none"><svg class="i s" aria-hidden="true"><use href="#i-locate"/></svg></span>
    <span style="flex:1"><span class="body-s" style="display:block;color:var(--app-ink)">Use my location</span><span class="cap">We ask your phone for permission first</span></span>
  </button>

  <h2 class="cap" style="padding:16px 16px 4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">Suggestions</h2>
  <ul id="sug" role="listbox" aria-label="Suggestions">
    <li><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-pin"/></svg><span style="flex:1"><span style="display:block"><b style="color:var(--app-ink)">Clar</b>emont, Cape Town</span><span class="cap">Suburb · 7708</span></span></button></li>
    <li><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-cash"/></svg><span style="flex:1"><span style="display:block"><b style="color:var(--app-ink)">Clar</b>emont Station ATM</span><span class="cap">ATM · Cape Town</span></span></button></li>
    <li><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-pin"/></svg><span style="flex:1"><span style="display:block"><b style="color:var(--app-ink)">Clar</b>emont, Johannesburg</span><span class="cap">Suburb · Gauteng</span></span></button></li>
    <li><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-pin"/></svg><span style="flex:1"><span style="display:block"><b style="color:var(--app-ink)">Cla</b>irwood, Durban</span><span class="cap">Suburb · KwaZulu-Natal</span></span></button></li>
  </ul>

  <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 8px 0 16px">
    <h2 class="cap" style="font-weight:700;letter-spacing:.04em;text-transform:uppercase">Recent searches</h2>
    <button type="button" class="btn btn-t btn-sm" style="min-height:44px">Clear all</button>
  </div>
  <ul>
    <li style="display:flex;align-items:center"><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-clock"/></svg><span style="flex:1">Sandton City, Johannesburg</span></button><button type="button" class="ib" style="border:0;margin-right:8px" aria-label="Remove Sandton City from recent searches"><svg class="i s"><use href="#i-x"/></svg></button></li>
    <li style="display:flex;align-items:center"><button type="button" class="row"><svg class="i s" aria-hidden="true" style="color:var(--app-text-muted)"><use href="#i-clock"/></svg><span style="flex:1">Gqeberha</span></button><button type="button" class="ib" style="border:0;margin-right:8px" aria-label="Remove Gqeberha from recent searches"><svg class="i s"><use href="#i-x"/></svg></button></li>
  </ul>
  <p class="cap" style="padding:16px">Recent searches stay on this device only. <span class="sample">Sample data</span></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
