<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile default map and results</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locator.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lc" style="width:375px;height:812px">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-bank" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-deposit" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"/></symbol>
<symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-24h" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14 5M4 12a8 8 0 0114-5M18 3v4h-4M6 21v-4h4"/></symbol>
<symbol id="i-wheel" viewBox="0 0 24 24"><circle cx="10" cy="4.5" r="1.5"/><path d="M10 8v6h5l3 5M7 12a5 5 0 105 7"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16v-4l2-5h10l2 5v4M3 16h18M7 19v-3M17 19v-3"/></symbol>
<symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
<symbol id="i-bm" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 01-10-10 8 8 0 1010 10z"/></symbol>
<symbol id="i-lang" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M11 5c0 4-3 7-7 8M13 21l4.5-10L22 21M14.5 18h6"/></symbol>
</defs></svg>

<div class="map" aria-hidden="true">
  <div class="water" style="left:-40px;top:300px;width:150px;height:120px"></div>
  <div class="park" style="left:230px;top:268px;width:110px;height:70px"></div>
  <span class="lbl" style="left:132px;top:216px">CLAREMONT</span>
  <span class="lbl" style="left:244px;top:350px">NEWLANDS</span>
  <div class="me" style="left:172px;top:292px"></div>
  <div class="pin pin-b" style="left:112px;top:262px"><svg class="i s"><use href="#i-bank"/></svg></div>
  <div class="pin pin-b" style="left:268px;top:240px"><svg class="i s"><use href="#i-bank"/></svg></div>
  <div class="pin pin-a" style="left:200px;top:340px"><svg class="i s"><use href="#i-cash"/></svg></div>
  <div class="pin pin-a" style="left:318px;top:312px"><svg class="i s"><use href="#i-cash"/></svg></div>
  <div class="pin pin-c" style="left:62px;top:372px">12</div>
</div>

<a href="#results" style="position:absolute;left:-999px;top:0;background:#fff;color:var(--app-ink);padding:12px;z-index:30">Skip to results</a>

<header style="position:absolute;left:0;right:0;top:0;padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;z-index:10">
  <div style="display:flex;gap:8px;align-items:center">
    <form role="search" class="inp float" style="flex:1;padding-right:4px">
      <svg class="i s" aria-hidden="true"><use href="#i-search"/></svg>
      <label for="q" style="position:absolute;left:-999px">Search for a place, suburb, town or postcode</label>
      <input id="q" type="search" placeholder="Suburb, town or postcode">
      <button type="button" class="ib" style="border:0;font:700 14px var(--font-sans)" aria-label="Language: English. Change language">EN</button>
    </form>
    <button type="button" class="ib float" aria-label="Saved branches"><svg class="i"><use href="#i-bm"/></svg></button>
  </div>
  <div class="seg" role="group" aria-label="Show">
    <button type="button" aria-pressed="true"><svg class="i s" aria-hidden="true"><use href="#i-bank"/></svg>Branches</button>
    <button type="button" aria-pressed="false"><svg class="i s" aria-hidden="true"><use href="#i-cash"/></svg>ATMs</button>
    <button type="button" aria-pressed="false">Both</button>
  </div>
  <div style="display:flex;gap:8px;overflow:hidden;padding-bottom:4px">
    <button type="button" class="chip" style="gap:6px"><svg class="i s" aria-hidden="true"><use href="#i-filter"/></svg>Filters</button>
    <button type="button" class="chip on" aria-pressed="true">Open now<svg class="i xs" aria-hidden="true"><use href="#i-x"/></svg><span style="position:absolute;left:-999px">remove filter</span></button>
    <button type="button" class="chip on" aria-pressed="true">Deposits<svg class="i xs" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
</header>

<button type="button" class="ib float" style="position:absolute;right:16px;top:346px;z-index:9" aria-label="Use my location"><svg class="i"><use href="#i-locate"/></svg></button>

<main class="sheet" style="top:406px;z-index:12">
  <div class="grab" role="separator" aria-label="Results sheet. Drag or use arrow keys to resize"><i></i></div>
  <div style="padding:0 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
    <div>
      <h1 id="results" class="h4" style="margin:0">Open branches near you</h1>
      <p class="cap num">7 results · nearest first</p>
    </div>
    <span class="sample">Sample data</span>
  </div>
  <ul style="padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <li>
      <article class="card" tabindex="0" aria-label="{{c.name}}">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <h2 class="h4" style="margin:0">{{c.name}}</h2>
          <span class="body-s num" style="color:var(--app-ink);white-space:nowrap">{{c.km}}</span>
        </div>
        <p class="cap" style="font-size:14px;margin-top:2px">{{c.sub}}</p>
        <div style="margin-top:8px"><span class="st {{c.stCls}}"><svg class="i xs" aria-hidden="true"><use href="{{c.stIcon}}"/></svg>{{c.stText}}</span></div>
        <ul class="svc" style="margin-top:12px">
          <sc-for list="{{c.svc}}" as="s" hint-placeholder-count="3">
          <li><svg class="i xs" aria-hidden="true"><use href="{{s.icon}}"/></svg>{{s.label}}</li>
          </sc-for>
        </ul>
        <div style="display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap">
          <a href="#" class="btn btn-sm" style="flex:1 1 130px"><svg class="i s" aria-hidden="true"><use href="#i-nav"/></svg>Directions</a>
          <button type="button" class="btn btn-t btn-sm"><svg class="i s" aria-hidden="true"><use href="#i-phone"/></svg>Call</button>
          <button type="button" class="btn btn-t btn-sm"><svg class="i s" aria-hidden="true"><use href="#i-bm"/></svg>Save</button>
        </div>
      </article>
    </li>
    </sc-for>
  </ul>
</main>

<sc-if value="{{showAnn}}" hint-placeholder-val="{{true}}">
<span class="ann" aria-hidden="true" style="left:4px;top:20px">1</span>
<span class="ann" aria-hidden="true" style="left:4px;top:84px">2</span>
<span class="ann" aria-hidden="true" style="left:4px;top:144px">3</span>
<span class="ann" aria-hidden="true" style="left:4px;top:434px">4</span>
<span class="ann" aria-hidden="true" style="left:340px;top:420px">5</span>
<span class="ann" aria-hidden="true" style="left:4px;top:480px">6</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnn":{"editor":"boolean","default":true},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const I = { dep:['#i-deposit','Cash deposits'], biz:['#i-brief','Business banking'], fx:['#i-globe','Forex'], h24:['#i-24h','24h ATM'], wheel:['#i-wheel','Wheelchair access'], park:['#i-car','Parking'] };
    const S = { open:['st-open','#i-check'], soon:['st-soon','#i-clock'], closed:['st-closed','#i-moon'] };
    const mk = (name, sub, km, st, stText, svc) => ({ name, sub, km, stCls:S[st][0], stIcon:S[st][1], stText, svc: svc.map(k => ({ icon:I[k][0], label:I[k][1] })) });
    return {
      showAnn: this.props.showAnn ?? true,
      cards: [
        mk('Capitec Cavendish Square','Claremont, Cape Town','0.4 km','soon','Closing soon · closes 17:00',['dep','biz','wheel','park']),
        mk('Capitec ATM · Claremont Station','Claremont, Cape Town','0.9 km','open','Open · 24 hours',['dep','h24']),
        mk('Capitec Kenilworth Centre','Kenilworth, Cape Town','2.1 km','closed','Closed · opens 08:00 tomorrow',['wheel','park'])
      ]
    };
  }
}
</script>
</body>
</html>
