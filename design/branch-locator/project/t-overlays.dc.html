<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet filters, saved and language</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locator.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}.band{position:absolute;left:0;width:834px;height:370px;overflow:hidden}.tag{position:absolute;right:16px;bottom:16px;z-index:30;background:var(--app-ink);color:#fff;font:700 12px var(--font-sans);padding:4px 12px;border-radius:30px}.fr{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--app-border);cursor:pointer}.fr input{width:24px;height:24px;accent-color:var(--app-primary-deep);margin:0;flex:none}.fr span{flex:1;font-weight:500;color:var(--app-ink)}.lg{display:flex;align-items:center;gap:16px;min-height:56px;padding:4px 16px;cursor:pointer;border-bottom:1px solid var(--app-border)}.lg input{width:24px;height:24px;accent-color:var(--app-primary-deep);margin:0}.lg.on{background:var(--app-primary-tint)}.home{display:inline-flex;align-items:center;gap:6px;font:700 14px/1.3 var(--font-sans);color:var(--app-primary-deep);background:var(--app-primary-tint);padding:2px 12px 2px 8px;border-radius:30px}</style>
</helmet>
<div class="lc" style="width:834px;height:1112px;background:#fff">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="i-deposit" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"/></symbol>
<symbol id="i-24h" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14 5M4 12a8 8 0 0114-5M18 3v4h-4M6 21v-4h4"/></symbol>
<symbol id="i-wheel" viewBox="0 0 24 24"><circle cx="10" cy="4.5" r="1.5"/><path d="M10 8v6h5l3 5M7 12a5 5 0 105 7"/></symbol>
<symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></symbol>
<symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
</defs></svg>

<!-- Band 1: filters -->
<div class="band" style="top:0">
  <div class="map" aria-hidden="true"></div><div style="position:absolute;inset:0;background:var(--lc-scrim)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="t1" style="position:absolute;left:197px;top:24px;width:440px;background:#fff;border-radius:var(--app-radius-md);box-shadow:var(--app-shadow-floating);padding:8px 16px 16px;z-index:10">
    <div style="display:flex;align-items:center;justify-content:space-between"><h1 id="t1" class="h4" style="margin:0">Filters</h1><button type="button" class="ib" style="border:0" aria-label="Close filters"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px">
      <label class="fr"><input type="checkbox" checked><span>Open now</span></label>
      <label class="fr"><input type="checkbox"><span>ATM with deposits</span></label>
      <label class="fr"><input type="checkbox"><span>Open Saturday</span></label>
      <label class="fr"><input type="checkbox"><span>24-hour access</span></label>
      <label class="fr"><input type="checkbox"><span>Open Sunday / holidays</span></label>
      <label class="fr"><input type="checkbox"><span>Wheelchair accessible</span></label>
      <label class="fr"><input type="checkbox"><span>Business banking</span></label>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:16px"><div class="seg" style="flex:1"><button type="button" aria-pressed="true">Distance</button><button type="button" aria-pressed="false">Name A–Z</button></div></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button type="button" class="btn btn-t">Clear all</button><button type="button" class="btn">Show 3 results</button></div>
  </section>
  <span class="tag">Filters · popover dialog</span>
</div>

<!-- Band 2: saved -->
<div class="band" style="top:371px;border-top:1px solid var(--app-border)">
  <div class="map" style="left:360px" aria-hidden="true"></div>
  <aside style="position:absolute;left:0;top:0;bottom:0;width:360px;background:#fff;border-right:1px solid var(--app-border);padding:16px;z-index:10;overflow:hidden">
    <h1 class="h4" style="margin:0">Saved branches</h1>
    <article class="card sel" style="margin-top:12px;padding:12px">
      <span class="home"><svg class="i xs" aria-hidden="true"><use href="#i-home"/></svg>Home branch</span>
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px"><h2 class="h4" style="margin:0;font-size:16px">Capitec Stellenbosch Eikestad</h2><span class="body-s num" style="color:var(--app-ink)">41 km</span></div>
      <div style="margin-top:4px"><span class="st st-open"><svg class="i xs" aria-hidden="true"><use href="#i-check"/></svg>Open · closes 17:00</span></div>
    </article>
    <article class="card" style="margin-top:8px;padding:12px">
      <div style="display:flex;justify-content:space-between;gap:8px"><h2 class="h4" style="margin:0;font-size:16px">Capitec Sandton City</h2><span class="body-s num" style="color:var(--app-ink)">1 402 km</span></div>
      <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap"><button type="button" class="btn btn-o btn-sm"><svg class="i s" aria-hidden="true"><use href="#i-home"/></svg>Set as home</button><button type="button" class="btn btn-t btn-sm">Remove</button></div>
    </article>
  </aside>
  <span class="tag">Saved · side panel view</span>
</div>

<!-- Band 3: language -->
<div class="band" style="top:742px;border-top:1px solid var(--app-border)">
  <div class="map" style="left:360px" aria-hidden="true"></div>
  <aside style="position:absolute;left:0;top:0;bottom:0;width:360px;background:#fff;border-right:1px solid var(--app-border);padding:24px 16px;z-index:5"><div class="inp" style="padding-right:4px"><span style="flex:1">Suburb, town or postcode</span><button type="button" class="ib focus" style="border:0;font:700 14px var(--font-sans)" aria-haspopup="menu" aria-expanded="true" aria-label="Language: English. Change language">EN</button></div></aside>
  <section role="dialog" aria-label="Language" style="position:absolute;left:200px;top:84px;width:320px;background:#fff;border-radius:var(--app-radius-md);box-shadow:var(--app-shadow-floating);overflow:hidden;z-index:10">
    <label class="lg on"><input type="radio" name="l" checked><span><b style="color:var(--app-ink)">English</b></span></label>
    <label class="lg"><input type="radio" name="l"><span><b style="color:var(--app-ink)">Afrikaans</b></span></label>
    <label class="lg" style="border:0"><input type="radio" name="l"><span><b style="color:var(--app-ink)">isiZulu</b></span></label>
  </section>
  <span class="tag">Language · anchored popover</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
