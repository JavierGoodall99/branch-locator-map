name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the checks only read the code. The deploy job asks for more, for itself only.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The end-to-end tests build and serve the production app themselves (see playwright.config.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Proves the Dockerfile builds, by building it: the production image, and the optional test stage.
      - run: docker build -t branch-locator .
      - run: docker build --target test .

      - name: Start the container and wait for its health check
        run: |
          docker run -d --name branch-locator -p 8080:8080 branch-locator
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' branch-locator)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs branch-locator
          exit 1

      # Opens the running container in a browser: headers, caching, compression, the map worker and tiles.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=container
        env:
          CONTAINER_URL: http://localhost:8080

      - name: Show the container's log if something failed
        if: failure()
        run: docker logs branch-locator

  # Publishes the app to GitHub Pages, only from main and only after every check above has passed.
  deploy:
    name: Deploy to GitHub Pages
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, and a newer one waits for the one running instead of cutting it off.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      # A project site is served at /<repository>/, not at the root, so the build is told where it will live.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
